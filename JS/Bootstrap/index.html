<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mi laboratorio Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <h1 class="text-primary">Mi laboratorio Bootstrap</h1>
    <h1 class="text-danger">Mi laboratorio Bootstrap</h1>
    <h1 class="text-success">Mi laboratorio Bootstrap</h1>
    <h1 class="text-center">Mi laboratorio Bootstrap</h1>
    <h1 class="text-danger text-center">Mi laboratorio Bootstrap</h1>

    <button class="btn btn-success">Primario</button>
    <button class="btn btn-primary">Primario</button>
    <button class="btn btn-danger">Primario</button>
    <button class="btn btn-warning">Primario</button>
    <button class="btn btn-outline-primary">Primario</button>
    <button class="btn btn-primary btn-lg">Primario</button>
    <button class="btn btn-primary btn-sm">Primario</button>

    <div class="bg-primary text-white p-1">Caja</div>
    <div class="bg-primary text-white p-3">Caja</div>
    <div class="bg-primary text-white p-5">Caja</div>
    <div class="bg-primary text-white m-1">Caja</div>
    <div class="bg-primary text-white m-3">Caja</div>
    <div class="bg-primary text-white m-5">Caja</div>

    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col-3 bg-primary text-white">1</div>
            <div class="col-3 bg-success text-white">2</div>
            <div class="col-3 bg-danger text-white">3</div>
            <div class="col-3 bg-warning text-white">4</div>
        </div>

        <div class="row mb-3">
            <div class="col-4 bg-primary text-white">1</div>
            <div class="col-4 bg-success text-white">2</div>
            <div class="col-4 bg-danger text-white">3</div>
        </div>

        <div class="row mb-3">
            <div class="col-6 bg-primary text-white">1</div>
            <div class="col-6 bg-success text-white">2</div>
        </div>

        <div class="row">
            <div class="col-12 col-md-6 col-lg-4 bg-info text-white p-3">Responsive 1</div>
            <div class="col-12 col-md-6 col-lg-4 bg-secondary text-white p-3">Responsive 2</div>
            <div class="col-12 col-md-6 col-lg-4 bg-dark text-white p-3">Responsive 3</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
